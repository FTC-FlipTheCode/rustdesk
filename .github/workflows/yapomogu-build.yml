name: Build Я ПОМОГУ! Агент (Windows)

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d" # same as upstream 1.5.0 (vcpkg.json baseline)

jobs:
  # Same as upstream flutter-build.yml: the Rust<->Dart bridge is generated per version, not committed.
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-windows:
    needs: generate-bridge
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init submodules
        shell: bash
        run: git submodule update --init --recursive

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1, same as upstream
        with:
          name: bridge-artifact
          path: ./

      - name: Install Rust stable (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Enable Flutter Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install LLVM 15.0.2
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "15.0.2"

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"; echo "======"; cat "$_1"; echo "======"; echo ""
            done
            exit 1
          fi

      - name: Patch hbb_common config
        shell: python
        run: |
          import re, os
          path = "libs/hbb_common/src/config.rs"
          with open(path, encoding="utf-8") as f:
              src = f.read()
          # ASCII app name: it becomes the install folder, service, registry key and exe name;
          # Cyrillic there broke the Windows "installed apps" entry. Clients see the agent UI branding.
          src = src.replace('"RustDesk"', '"YaPomogu"', 1)
          server = os.environ.get("RENDEZVOUS_SERVER") or "agent.yapomogu.com"
          src = src.replace('"rs-ny.rustdesk.com"', f'"{server}"', 1)
          pub_key = os.environ.get("RS_PUB_KEY", "")
          if pub_key:
              src = re.sub(
                  r'pub const RS_PUB_KEY: &str = "[^"]*"',
                  f'pub const RS_PUB_KEY: &str = "{pub_key}"',
                  src,
              )
          with open(path, "w", encoding="utf-8") as f:
              f.write(src)
        env:
          RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}

      - name: Run Flutter tests
        working-directory: flutter
        run: flutter test test/yapomogu/

      - name: Flutter pub get
        shell: bash
        run: pushd flutter && flutter pub get && popd

      - name: Stamp agent build number
        shell: bash
        run: echo "const int kYpBuild = ${{ github.run_number }};" > flutter/lib/yapomogu/build_info.dart

      - name: Build portable .exe
        shell: bash
        run: python3 ./build.py --portable --hwcodec --flutter
        env:
          VCPKG_ROOT: C:\vcpkg
          LIBCLANG_PATH: ${{ env.LLVM_PATH }}/bin

      - name: Get version
        id: version
        shell: bash
        run: echo "ver=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)" >> $GITHUB_OUTPUT

      - name: Name the exe by build number
        shell: bash
        run: cp rustdesk-*-install.exe "yapomogu-agent-${{ github.run_number }}.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yapomogu-agent-${{ github.run_number }}-${{ steps.version.outputs.ver }}
          path: |
            yapomogu-agent-*.exe
            rustdesk-*-install.exe
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: rustdesk-*-install.exe
          name: "Я ПОМОГУ! Агент ${{ steps.version.outputs.ver }}"
